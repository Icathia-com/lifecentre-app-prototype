# The upload Worker (see src/index.js). Deployed from the repository root with:
#   npx wrangler@4 deploy --config cloudflare/uploads/wrangler.toml
# No secrets: the bucket is reached through the binding below, and expired story records are removed by the church's hourly
# Apps Script job (apps-script/Votd.js), which already writes to Firestore as the script owner.
name = "lifecentre-uploads"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = [] # none: the clean-up moved to Apps Script (an empty list removes the old schedule on deploy)

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "lifecentre-uploads"

[vars]
FIREBASE_PROJECT_ID = "lifecentre-app"
BUCKET_NAME = "lifecentre-uploads"
PUBLIC_BASE_URL = "https://pub-6e5175904733427ab0e9528a3c78c10e.r2.dev" # the bucket's public address (an r2.dev address, or a custom domain)
ALLOWED_ORIGINS = "https://icathia.com,http://localhost:5173,http://localhost:8000" # the live app, and the app served locally (npm run serve)
