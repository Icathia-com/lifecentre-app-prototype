</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'empower' }; }
  renderVals() {
    const list = [
      { id: 'empower', name: 'Empower Room', note: '[Capacity]' },
      { id: 'r2', name: '[Room name]', note: '[Capacity]' },
      { id: 'r3', name: '[Room name]', note: '[Capacity]' },
      { id: 'r4', name: '[Room name]', note: '[Capacity]' }
    ];
    const rooms = list.map((r) => {
      const on = this.state.picked === r.id;
      return { ...r,
        style: 'min-height: 80px; border-radius: 22px; border: 1px solid ' + (on ? '#0B1220' : 'rgba(255,255,255,0.95)') + '; background: ' + (on ? '#0B1220' : 'rgba(255,255,255,0.8)') + '; color: ' + (on ? '#FFFFFF' : '#0B1220') + '; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 14px; font-family: inherit; text-align: left; cursor: pointer',
        noteStyle: 'font-size: 12px; color: ' + (on ? '#C9D2E0' : '#55627A'),
        pick: () => this.setState({ picked: r.id }) };
    });
    return { rooms };
  }
}
</script>
